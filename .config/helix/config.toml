[theme]
dark = "catppuccin_frappe"
light = "catppuccin_latte"

[editor]
true-color = true
bufferline = "multiple"

[keys.normal]
"space" = { "C-g" = ":sh printf '%%s' %{file_path_absolute} | pbcopy" } # copy absolute path to clipboard
"C-r" = ":reload-all"


[editor.soft-wrap]
enable = true
wrap-indicator = ""

[editor.workspace-trust]
level = "insecure"
