skip-commit-generation-prompt = true
[pre-start]
submodules = '''GIT_COMMON_DIR=$(git -C "{{ primary_worktree_path }}" rev-parse --absolute-git-dir)
GITMODULES="{{ primary_worktree_path }}/.gitmodules"
if [ ! -f "$GITMODULES" ]; then exit 0; fi
git config --file "$GITMODULES" --get-regexp 'submodule\..*\.path' | awk '{print $2}' | while read -r sm_path; do
  MODULES_DIR="$GIT_COMMON_DIR/modules/$sm_path"
  TARGET="{{ worktree_path }}/$sm_path"
  if [ -d "$MODULES_DIR" ]; then
    # Store each linked worktree's working-tree path per-worktree (in
    # worktrees/<name>/config.worktree) instead of the shared config. Without
    # this, `git worktree add` clobbers the shared core.worktree (the main
    # checkout's pointer) with a wrong-depth path, fataling every worktree's
    # `git worktree list/status/prune`.
    git -C "$MODULES_DIR" config extensions.worktreeConfig true
    COMMIT=$(git -C "{{ worktree_path }}" ls-files --stage -- "$sm_path" | awk '{print $2}')
    if git -C "$MODULES_DIR" worktree add --detach "$TARGET" "$COMMIT"; then
      # `git worktree add` does not reliably write a per-worktree core.worktree
      # even with worktreeConfig on; when it's absent git falls back to the
      # wrong-depth shared value and every file shows as deleted/untracked
      # ("modified content, untracked content"). Pin it explicitly.
      git -C "$TARGET" config --worktree core.worktree "$TARGET"
    else
      git -C "{{ worktree_path }}" submodule update --init -- "$sm_path"
    fi
  else
    git -C "{{ worktree_path }}" submodule update --init -- "$sm_path"
  fi
done'''

[pre-remove]
submodules = '''GIT_COMMON_DIR=$(git -C "{{ primary_worktree_path }}" rev-parse --absolute-git-dir)
GITMODULES="{{ primary_worktree_path }}/.gitmodules"
if [ ! -f "$GITMODULES" ]; then exit 0; fi
git config --file "$GITMODULES" --get-regexp 'submodule\..*\.path' | awk '{print $2}' | while read -r sm_path; do
  MODULES_DIR="$GIT_COMMON_DIR/modules/$sm_path"
  if [ -d "$MODULES_DIR" ]; then
    git -C "$MODULES_DIR" worktree remove --force "{{ worktree_path }}/$sm_path" 2>/dev/null || true
    git -C "$MODULES_DIR" worktree prune
  fi
done'''

[post-start]
agent-md = '''find "{{ primary_worktree_path }}" \( -name CLAUDE.md -o -name AGENTS.md \) -not -path '*/node_modules/*' -not -path '*/.git/*' | while read f; do
  rel="${f#{{ primary_worktree_path }}/}"
  if git -C "{{ primary_worktree_path }}" check-ignore -q "$rel"; then
    mkdir -p "$(dirname "$rel")"
    cp "$f" "$rel"
  fi
done'''
direnv-allow = '''if [ -f "{{ worktree_path }}/.envrc" ]; then
  direnv allow "{{ worktree_path }}"
fi'''

[merge]
no-commit = true

[projects]

[projects."aus-gitlab.local.tenstorrent.com/arch/callandor"]
# Touch .brewfile.cache so new worktrees start warm — skips the slow
# `brew bundle check` Ruby startup on first direnv load.
post-start.brew-cache = "touch {{ worktree_path }}/.brewfile.cache"
